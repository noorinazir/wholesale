services:
  - type: web
    name: wholesale-outreach
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://wholesale-jr0r.onrender.com
      - key: ASSET_URL
        value: https://wholesale-jr0r.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
      - key: RESEND_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        value: moonshot-v1-8k
      - key: KIMI_BASE_URL
        value: https://api.moonshot.cn/v1
